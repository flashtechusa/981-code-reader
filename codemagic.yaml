# Codemagic CI for Boxster SRS
#
# Prerequisites (Codemagic UI, once):
#   * Teams > Integrations > App Store Connect: add an API key and name the
#     integration (currently named "ColorChase").
#   * Environment variables > group "code-signing" > CERTIFICATE_PRIVATE_KEY
#     (an RSA private key in PEM form, marked Secret). The first build uses it
#     to create the Apple Distribution certificate; later builds reuse it.
#   * The bundle id and App Store provisioning profile are created
#     automatically by `fetch-signing-files --create`. The App Store Connect
#     app record (needed only for the TestFlight upload) must be created once
#     at appstoreconnect.apple.com with bundle id com.flashtech.boxstersrs.
#   * Nothing secret is committed to the repo.
#
# The ios/ folder in git is only the hand-written Info.plist. Every workflow
# therefore runs `flutter create .` first (it never overwrites existing files)
# and then tool/patch_ios.sh to set the bundle id / deployment target.

workflows:
  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ColorChase
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Signing is done by the "Set up code signing" script below, which can
      # CREATE the bundle id, distribution certificate and App Store profile
      # on first run. It needs CERTIFICATE_PRIVATE_KEY (RSA PEM, marked Secret)
      # in an environment-variable group named `code-signing`. (The declarative
      # `ios_signing:` block can only fetch profiles that already exist, which
      # is why the first build failed with "No matching profiles found".)
      groups:
        - code-signing
      vars:
        BUNDLE_ID: com.flashtech.boxstersrs
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Generate platform folders
        script: |
          flutter create --org com.flashtech --project-name boxster_srs --platforms=ios,android .
          bash tool/patch_ios.sh
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: flutter test
        script: flutter test
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods (CocoaPods projects only)
        script: |
          # Flutter stable now generates new iOS projects with Swift Package
          # Manager instead of CocoaPods, so there is no Podfile and nothing to
          # install - `flutter build ipa` resolves packages itself. Older
          # toolchains still produce a Podfile; handle both.
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update
          else
            echo "No ios/Podfile (Swift Package Manager project) - skipping pod install"
          fi
      - name: flutter build ipa
        script: |
          # PROJECT_BUILD_NUMBER is Codemagic's monotonically increasing counter.
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # internal testers get builds without beta review; flip to true for external testers
        beta_groups: []
        submit_to_app_store: false

  test-only:
    name: Analyze and test
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: flutter test
        script: flutter test
    artifacts:
      - flutter_drive.log
