# Codemagic CI for Boxster SRS
#
# Prerequisites (Codemagic UI, once):
#   * Teams > Integrations > App Store Connect: add an API key and name the
#     integration exactly "App Store Connect".
#   * Register the bundle id com.flashtech.boxstersrs in the Apple Developer
#     portal and create the app record in App Store Connect.
#   * Automatic code signing below fetches/creates the certificate + profile
#     for that bundle id - nothing is committed to the repo.
#
# The ios/ folder in git is only the hand-written Info.plist. Every workflow
# therefore runs `flutter create .` first (it never overwrites existing files)
# and then tool/patch_ios.sh to set the bundle id / deployment target.

workflows:
  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: App Store Connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flashtech.boxstersrs
      vars:
        BUNDLE_ID: com.flashtech.boxstersrs
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Generate platform folders
        script: |
          flutter create --org com.flashtech --project-name boxster_srs --platforms=ios,android .
          bash tool/patch_ios.sh
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze
      - name: flutter test
        script: flutter test
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
      - name: flutter build ipa
        script: |
          # PROJECT_BUILD_NUMBER is Codemagic's monotonically increasing counter.
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []
        submit_to_app_store: false

  test-only:
    name: Analyze and test
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze
      - name: flutter test
        script: flutter test
    artifacts:
      - flutter_drive.log
