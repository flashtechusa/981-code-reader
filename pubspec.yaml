name: boxster_srs
description: Porsche 981 airbag (POSIP) DTC reader / clearer and OBD-II live data for Wi-Fi ELM327 adapters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
